[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blueframe-backend"
version = "0.1.0"
description = "Local backend for BlueFrame Studio"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28",
  "jsonschema>=4.23",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["."]
include = ["blueframe*"]
