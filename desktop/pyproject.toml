[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blueframe-desktop"
version = "0.1.0"
description = "Native Windows shell for BlueFrame Studio"
requires-python = ">=3.11"
dependencies = ["pywebview>=5.4"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
blueframe-studio = "blueframe_desktop.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../backend"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blueframe_desktop*"]
